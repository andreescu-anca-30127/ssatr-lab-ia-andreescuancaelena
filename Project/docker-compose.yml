version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: feedback-postgres
    environment:
      POSTGRES_DB: feedback_db
      POSTGRES_USER: feedback_user
      POSTGRES_PASSWORD: feedback_pass
    ports:
      - "5432:5432"
    volumes:
    # - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - feedback-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_user -d feedback_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  feedback-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
